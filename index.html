<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slither Rush</title>
<style>
:root{--card:#fff;--text:#1d2030;--muted:#6b7088;--line:#dfe2ef;--accent:#6c4cf1;--cv:#eef1fb;--grid:#cfd5ea;--out:#f3d4da;--bg:#eef1fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1e2030;--text:#eef0fa;--muted:#9aa0bb;--line:#33364d;--accent:#8f77ff;--cv:#161826;--grid:#262a40;--out:#2b1420;--bg:#161826;color-scheme:dark}}
:root[data-theme="dark"]{--card:#1e2030;--text:#eef0fa;--muted:#9aa0bb;--line:#33364d;--accent:#8f77ff;--cv:#161826;--grid:#262a40;--out:#2b1420;--bg:#161826;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hide{display:none!important}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;background:var(--card);padding:8px 12px;border-radius:12px;opacity:.92;font-size:.9rem;pointer-events:none}
.hud b{font-size:1.3rem}.hud .m{color:var(--muted);font-size:.8rem}
.lb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;background:var(--card);padding:8px 12px;border-radius:12px;opacity:.92;font-size:.8rem;min-width:120px;pointer-events:none}
.lb h4{margin:0 0 4px;font-size:.8rem;color:var(--muted)}
.lb ol{margin:0;padding-left:18px}.lb li.me{color:var(--accent);font-weight:700}
.boost{display:none;position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:74px;height:74px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:2rem;align-items:center;justify-content:center;touch-action:none;opacity:.9}
@media (pointer:coarse){.boost{display:flex}}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,24,.45);padding:16px}
.card{background:var(--card);border-radius:20px;padding:24px;width:100%;max-width:360px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.card h1{margin:0 0 6px;font-size:1.8rem}
.card p{color:var(--muted);margin:0 0 14px;font-size:.95rem;line-height:1.4}
input{width:100%;padding:12px;margin-bottom:10px;border-radius:12px;border:2px solid var(--line);background:var(--cv);color:var(--text);font:inherit;text-align:center}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:1.05rem;cursor:pointer}
</style>
</head>
<body>
<div id="pvgate" style="position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg,#eef1fb)"><div style="background:var(--card,#fff);color:var(--text,#1d2030);border-radius:20px;padding:24px;max-width:360px;width:100%;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25);font-family:system-ui,sans-serif"><h2 style="margin:0 0 8px">Slither Rush</h2><p id="pvmsg" style="margin:0 0 14px;opacity:.75">Loading…</p><button id="pvbtn" style="display:none;width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent,#6c4cf1);color:#fff;font:inherit;font-weight:600;font-size:1.05rem">🔐 Sign in with Google</button><a href="https://playversegames.github.io/clue-rush/" style="display:block;margin-top:14px;color:inherit;opacity:.6;text-decoration:none;font-size:.9rem">← Playverse</a></div></div>
<canvas id="cv"></canvas>
<div class="hud hide" id="hud"><div>Score <b id="sc">0</b></div><div class="m">Kills <span id="kl">0</span> · Rank <span id="rk">1</span></div></div>
<div class="lb hide" id="lb"><h4>Leaderboard</h4><ol id="lbl"></ol></div>
<button class="boost hide" id="bt" aria-label="Boost">⚡</button>
<div class="ov" id="ov">
  <div class="card">
    <a href="https://playversegames.github.io/clue-rush/" style="display:block;text-align:left;margin-bottom:8px;color:var(--muted,#6b7088);text-decoration:none;font-size:.9rem">← Playverse</a>
    <h1 id="ttl">🐍 Slither Rush</h1>
    <p id="msg">Eat glowing orbs to grow. Crash into another snake’s body and you’re out. Steer with your mouse or finger, hold to boost.</p>
    <input id="nm" maxlength="12" placeholder="Your name" autocomplete="off">
    <button class="btn" id="go">Play</button>
    <div id="top" style="margin-top:14px;text-align:left;font-size:.85rem;color:var(--muted)"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
const ARENA=1600,NBOT=12,SP=7;
const COLORS=['#ff5c6c','#ffb02e','#ffe14d','#5fe08a','#37c9d6','#4f8cff','#9b6bff','#ff6bd6','#ff8a4d','#a3e635'];
const NAMES=['Viper','Mamba','Noodle','Slinky','Cobra','Python','Ziggy','Rattle','Boa','Sidewinder','Nacho','Zorro','Fang','Slither'];
let W,H,DPR,snakes=[],foods=[],me=null,spec=null,running=false,frame=0,uid=0;
const cam={x:0,y:0,z:1};let K=1;
let ptrA=0,mouseDown=false,boostKey=false,boostBtn=false;
let best=0;try{best=+localStorage.getItem('snake_best')||0;}catch(e){}
let theme={};
function readTheme(){const s=getComputedStyle(document.documentElement);['--cv','--grid','--out','--text'].forEach(k=>theme[k]=s.getPropertyValue(k).trim());}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
addEventListener('resize',resize);resize();readTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readTheme);

const rad=s=>6+Math.min(s.len,300)*0.03;
function mk(name,color,bot){
  const a=Math.random()*6.28,r=Math.sqrt(Math.random())*ARENA*0.7,ang=Math.random()*6.28;
  const x=Math.cos(ang)*r,y=Math.sin(ang)*r;
  const s={id:uid++,name,color,bot,x,y,a,ta:a,len:10,segs:[],boost:false,alive:true,t:0,wa:0,kills:0,food:null};
  for(let i=1;i<=10;i++)s.segs.push({x:x-Math.cos(a)*SP*i,y:y-Math.sin(a)*SP*i});
  return s;
}
function addFood(x,y,v,c){if(foods.length<900)foods.push({x,y,v,c:c||COLORS[Math.random()*COLORS.length|0]});}
function randFood(){const a=Math.random()*6.28,r=Math.sqrt(Math.random())*(ARENA-30);addFood(Math.cos(a)*r,Math.sin(a)*r,1);}
function botName(){return NAMES[Math.random()*NAMES.length|0];}
function botColor(){return COLORS[Math.random()*COLORS.length|0];}
for(let i=0;i<NBOT;i++)snakes.push(mk(botName(),botColor(),true));
for(let i=0;i<350;i++)randFood();

function step(s){
  let da=s.ta-s.a;da=Math.atan2(Math.sin(da),Math.cos(da));
  const mt=0.075*K,pr=1-Math.pow(0.7,K);
  s.a+=Math.max(-mt,Math.min(mt,da*pr));
  if(s.a>Math.PI)s.a-=Math.PI*2;else if(s.a<-Math.PI)s.a+=Math.PI*2;
  const boosting=s.boost&&s.len>12;
  const sp=(boosting?4.4:2.6)*K;
  s.x+=Math.cos(s.a)*sp;s.y+=Math.sin(s.a)*sp;
  if(boosting){s.len-=0.05*K;if(Math.random()<0.15*K){const g=s.segs[s.segs.length-1];addFood(g.x,g.y,1,s.color);}}
  const n=Math.floor(s.len);
  while(s.segs.length<n){const l=s.segs[s.segs.length-1];s.segs.push({x:l.x,y:l.y});}
  while(s.segs.length>n)s.segs.pop();
  let px=s.x,py=s.y;
  for(const g of s.segs){
    const dx=px-g.x,dy=py-g.y,d=Math.hypot(dx,dy)||1;
    if(d>SP){const k=(d-SP)/d;g.x+=dx*k;g.y+=dy*k;}
    px=g.x;py=g.y;
  }
}
function eat(s){
  const r=rad(s)+10;
  for(let i=foods.length-1;i>=0;i--){
    const f=foods[i],dx=f.x-s.x,dy=f.y-s.y;
    if(dx*dx+dy*dy<r*r){s.len+=f.v*0.4;foods[i]=foods[foods.length-1];foods.pop();}
  }
}
function ai(s){
  s.t-=K;if(s.t<=0){s.t=20+Math.random()*40;s.wa=(Math.random()-0.5)*1.6;}
  let ta=s.a+s.wa*0.3;
  if((frame+s.id)%3===0){
    let b=null,bd=260*260;
    for(const f of foods){const dx=f.x-s.x,dy=f.y-s.y,d=dx*dx+dy*dy;if(d<bd){bd=d;b=f;}}
    s.food=b;
  }
  if(s.food)ta=Math.atan2(s.food.y-s.y,s.food.x-s.x);
  if(Math.hypot(s.x,s.y)>ARENA-180)ta=Math.atan2(-s.y,-s.x);
  const lx=s.x+Math.cos(s.a)*55,ly=s.y+Math.sin(s.a)*55;
  outer:for(const o of snakes){
    if(o===s||!o.alive)continue;
    const ro=rad(o)+rad(s)+14,lim=ro*ro*1.5;
    for(let i=0;i<o.segs.length;i+=2){
      const g=o.segs[i],dx=g.x-lx,dy=g.y-ly;
      if(dx*dx+dy*dy<lim){
        const cr=Math.cos(s.a)*(g.y-s.y)-Math.sin(s.a)*(g.x-s.x);
        ta=s.a+(cr>0?-1.5:1.5);s.food=null;break outer;
      }
    }
  }
  s.ta=ta;s.boost=false;
}
function kill(s,by){
  if(!s.alive)return;
  s.alive=false;
  s.segs.forEach((g,i)=>{if(i%2===0)addFood(g.x+(Math.random()-0.5)*8,g.y+(Math.random()-0.5)*8,2,s.color);});
  if(by&&by!==s)by.kills++;
  if(s===me){setTimeout(onDeath,800);}
  else if(s.bot){setTimeout(()=>{const i=snakes.indexOf(s);if(i>=0)snakes[i]=mk(botName(),botColor(),true);},2500);}
}
function update(){
  frame++;
  if(me&&me.alive){me.ta=ptrA;me.boost=boostKey||boostBtn||mouseDown;}
  for(const s of snakes){if(!s.alive)continue;if(s.bot)ai(s);step(s);eat(s);}
  for(const s of snakes){
    if(!s.alive)continue;
    if(Math.hypot(s.x,s.y)>ARENA){kill(s,null);continue;}
    const rs=rad(s);
    for(const o of snakes){
      if(o===s||!o.alive)continue;
      const ro=rad(o),lim=(rs*0.8+ro*0.9)**2;
      let hit=false;
      for(const g of o.segs){const dx=g.x-s.x,dy=g.y-s.y;if(dx*dx+dy*dy<lim){hit=true;break;}}
      if(!hit){const dx=o.x-s.x,dy=o.y-s.y;if(dx*dx+dy*dy<lim&&s.len<=o.len)hit=true;}
      if(hit){kill(s,o);break;}
    }
  }
  let g=0;while(foods.length<350&&g++<3)randFood();
  if(frame%15===0)hudUpdate();
}
const score=s=>Math.floor(s.len*5);
function hudUpdate(){
  const live=snakes.filter(s=>s.alive).sort((a,b)=>b.len-a.len);
  const l=$('lbl');l.innerHTML='';
  live.slice(0,5).forEach(s=>{const li=document.createElement('li');li.textContent=s.name+' – '+score(s);if(s===me)li.className='me';l.appendChild(li);});
  if(me&&me.alive){
    $('sc').textContent=score(me);$('kl').textContent=me.kills;$('rk').textContent=(live.indexOf(me)+1)+'/'+live.length;
  }
}
function onDeath(){
  running=false;
  const sc=score(me),nb=sc>best;
  if(nb){best=sc;try{localStorage.setItem('snake_best',best);}catch(e){}}
  if(window.PV&&PV.user)PV.best(sc,me.kills).then(loadTop);
  $('ttl').textContent='Game over';
  $('msg').textContent='Score '+sc+' · '+me.kills+' kill'+(me.kills===1?'':'s')+(nb?' · New best! 🎉':' · Best '+best);
  $('go').textContent='Play Again';
  $('ov').classList.remove('hide');$('hud').classList.add('hide');$('lb').classList.add('hide');$('bt').classList.add('hide');
}
function start(){
  const nm=$('nm').value.trim().slice(0,12)||'You';
  snakes=snakes.filter(s=>s.bot);
  me=mk(nm,'#38bdf8',false);me.x=me.y=0;me.segs.forEach((g,i)=>{g.x=-Math.cos(me.a)*SP*(i+1);g.y=-Math.sin(me.a)*SP*(i+1);});
  ptrA=me.a;snakes.push(me);running=true;
  $('ov').classList.add('hide');$('hud').classList.remove('hide');$('lb').classList.remove('hide');$('bt').classList.remove('hide');
  hudUpdate();
}
$('go').onclick=start;

async function loadTop(){
  const el=$('top');if(!el||!window.PV||!PV.user)return;
  try{const r=await PV.top('best');el.innerHTML=r.length?'<b>🏆 Top players</b><ol style="margin:6px 0 0;padding-left:20px">'+r.slice(0,5).map(x=>'<li>'+String(x.name||'Player').replace(/[<>&]/g,'')+' – '+(x.best||0)+'</li>').join('')+'</ol>':'';}catch(e){}
}
document.addEventListener('pv-ready',async()=>{$('nm').value=PV.name;const m=await PV.mine();if((m.best||0)>best){best=m.best;}loadTop();});
const aim=e=>{const dx=e.clientX-W/2,dy=e.clientY-H/2;if(dx*dx+dy*dy>400)ptrA=Math.atan2(dy,dx);};
cv.addEventListener('pointermove',aim);
cv.addEventListener('pointerdown',e=>{aim(e);if(e.pointerType==='mouse')mouseDown=true;});
addEventListener('pointerup',()=>{mouseDown=false;});
const bt=$('bt');
bt.addEventListener('pointerdown',e=>{e.preventDefault();boostBtn=true;});
['pointerup','pointercancel','pointerleave'].forEach(t=>bt.addEventListener(t,()=>{boostBtn=false;}));
const keys={};
function keyDir(){const dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);if(dx||dy)ptrA=Math.atan2(dy,dx);}
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){boostKey=true;e.preventDefault();}
  keys[e.key]=true;keyDir();
});
addEventListener('keyup',e=>{if(e.code==='Space')boostKey=false;keys[e.key]=false;});

function draw(){
  const f=(me&&me.alive)?me:(spec&&spec.alive?spec:(spec=snakes.find(s=>s.alive)));
  const kc=1-Math.pow(0.88,K);if(f){cam.x+=(f.x-cam.x)*kc;cam.y+=(f.y-cam.y)*kc;}
  const tz=1.1-Math.min(f?f.len:10,300)/600;cam.z+=(tz-cam.z)*(1-Math.pow(0.95,K));
  if(frame%60===0)readTheme();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=theme['--out'];ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2,H/2);ctx.scale(cam.z,cam.z);ctx.translate(-cam.x,-cam.y);
  ctx.fillStyle=theme['--cv'];ctx.beginPath();ctx.arc(0,0,ARENA,0,6.2832);ctx.fill();
  ctx.strokeStyle='#ff4d6d';ctx.lineWidth=6;ctx.stroke();
  const hw=W/2/cam.z+40,hh=H/2/cam.z+40,L=cam.x-hw,R=cam.x+hw,T=cam.y-hh,B=cam.y+hh;
  ctx.fillStyle=theme['--grid'];
  for(let x=Math.floor(L/80)*80;x<R;x+=80)for(let y=Math.floor(T/80)*80;y<B;y+=80)if(x*x+y*y<ARENA*ARENA)ctx.fillRect(x-2,y-2,4,4);
  for(const o of foods){
    if(o.x<L||o.x>R||o.y<T||o.y>B)continue;
    ctx.fillStyle=o.c;ctx.globalAlpha=0.35;ctx.beginPath();ctx.arc(o.x,o.y,5+o.v*2.5,0,6.2832);ctx.fill();
    ctx.globalAlpha=1;ctx.beginPath();ctx.arc(o.x,o.y,2.5+o.v*1.5,0,6.2832);ctx.fill();
  }
  for(const s of snakes){
    if(!s.alive)continue;
    const r=rad(s);
    ctx.fillStyle=s.color;ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=1;
    for(let i=s.segs.length-1;i>=0;i--){
      const g=s.segs[i];
      if(g.x<L-r||g.x>R+r||g.y<T-r||g.y>B+r)continue;
      ctx.beginPath();ctx.arc(g.x,g.y,r,0,6.2832);ctx.fill();ctx.stroke();
    }
    ctx.beginPath();ctx.arc(s.x,s.y,r,0,6.2832);ctx.fill();ctx.stroke();
    const cx=Math.cos(s.a),cy=Math.sin(s.a);
    for(const sg of[-1,1]){
      const ex=s.x+cx*r*0.4-cy*r*0.5*sg,ey=s.y+cy*r*0.4+cx*r*0.5*sg;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,r*0.38,0,6.2832);ctx.fill();
      ctx.fillStyle='#111';ctx.beginPath();ctx.arc(ex+cx*r*0.14,ey+cy*r*0.14,r*0.2,0,6.2832);ctx.fill();
    }
    ctx.fillStyle=theme['--text'];ctx.font='600 '+Math.round(12/cam.z)+'px system-ui,sans-serif';ctx.textAlign='center';
    ctx.fillText(s.name,s.x,s.y-r-8);
  }
  ctx.restore();
}
let last=performance.now();
function loop(t){
  K=Math.min(2.5,Math.max(0.2,(t-last)/16.667));last=t;
  update();draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,linkWithPopup,signInWithCredential,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,increment,serverTimestamp,collection,query,orderBy,limit,getDocs}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDHcp44KXR6Gax_Vf3fwdinWBgJB4l_92Y",authDomain:"clue-rush-a7bbe.firebaseapp.com",projectId:"clue-rush-a7bbe",storageBucket:"clue-rush-a7bbe.firebasestorage.app",messagingSenderId:"439710542707",appId:"1:439710542707:web:b55e0a8f2c309b86e8b306"}),auth=getAuth(app),fs=getFirestore(app),COLL="snakeio";
const g=document.getElementById("pvgate"),b=document.getElementById("pvbtn"),m=document.getElementById("pvmsg");
const ref=()=>doc(fs,COLL,PV.user.uid);
window.PV={user:null,name:"",
  async add(w,p){try{await setDoc(ref(),{name:PV.name,won:increment(w),played:increment(p),at:serverTimestamp()},{merge:true})}catch(e){}},
  async best(sc,k){try{const s=await getDoc(ref()),c=s.exists()?(s.data().best||0):0;if(sc>c)await setDoc(ref(),{name:PV.name,best:sc,kills:k,at:serverTimestamp()},{merge:true});return Math.max(sc,c)}catch(e){return sc}},
  async mine(){try{const s=await getDoc(ref());return s.exists()?s.data():{}}catch(e){return {}}},
  async top(f){const q=await getDocs(query(collection(fs,COLL),orderBy(f,"desc"),limit(20)));return q.docs.map(d=>({id:d.id,...d.data()}))},
  out(){signOut(auth).finally(()=>location.reload())}};
b.onclick=async()=>{const pr=new GoogleAuthProvider(),cu=auth.currentUser;try{
  if(cu&&cu.isAnonymous){try{await linkWithPopup(cu,pr)}catch(e){if(e&&e.code==="auth/credential-already-in-use")await signInWithCredential(auth,GoogleAuthProvider.credentialFromError(e));else throw e}}
  else await signInWithPopup(auth,pr);
  if(auth.currentUser&&!auth.currentUser.isAnonymous)enter(auth.currentUser)}
  catch(e){const c=e&&e.code;if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment")signInWithRedirect(auth,pr);else if(c!=="auth/popup-closed-by-user"&&c!=="auth/cancelled-popup-request")m.textContent="Sign-in failed. Please try again."}};
function enter(u){if(PV.user)return;PV.user=u;PV.name=String(u.displayName||"Player").split(" ")[0].slice(0,12);g.remove();document.dispatchEvent(new Event("pv-ready"))}
onAuthStateChanged(auth,u=>{if(u&&!u.isAnonymous)enter(u);else if(!PV.user){m.textContent="Sign in with Google to play.";b.style.display=""}});
</script>
</body>
</html>
